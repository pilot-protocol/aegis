name: release

# Build cross-platform binaries on every version tag and attach them to the
# GitHub Release. Linux runners link natively, so musl static builds "just work".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: aegis-macos-arm64
          # macos-13 (the last Intel runner image) was retired by GitHub, so
          # x86_64 builds cross-compile on the arm64 runner instead. Pure-Rust
          # deps + the universal macOS SDK make this a plain `--target` build.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: aegis-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: aegis-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: aegis-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl/cross tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --git https://github.com/cross-rs/cross || true
      - name: Build
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Rename artifact
        run: cp target/${{ matrix.target }}/release/aegis ${{ matrix.name }}
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.name }}
          fail_on_unmatched_files: true
